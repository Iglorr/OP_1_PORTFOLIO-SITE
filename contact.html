<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Portfolio</title>
    <link rel="stylesheet" href="assets/CSS/style.css">
</head>

<body>
    <header>
        <h1 class="site-name">Contact.</h1>
        <nav aria-label="Hoofdnavigatie">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="projecten.html">Projecten</a></li>
                <li><a href="blog.html">Blog</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-page">
        <section aria-labelledby="contact-title">
            <h2 id="contact-title">Contact formulier</h2>
            <form class="contact-form" aria-labelledby="contact-title">
                <p class="contact-first-name">
                    <label for="first-name">Naam</label>
                    <input id="first-name" name="first-name" type="text" autocomplete="given-name">
                </p>
                <p class="contact-last-name">
                    <label for="last-name">Achternaam</label>
                    <input id="last-name" name="last-name" type="text" autocomplete="family-name">
                </p>
                <p class="contact-email">
                    <label for="email">E-mailadres</label>
                    <input id="email" name="email" type="email" autocomplete="email">
                </p>
                <p class="contact-message">
                    <label for="message">Bericht</label>
                    <textarea id="message" name="message" rows="12"></textarea>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Lior Resida. Met veel zin gemaakt.</p>
        <p>25149946@student.hhs.nl</p>
    </footer>
</body>

</html>
